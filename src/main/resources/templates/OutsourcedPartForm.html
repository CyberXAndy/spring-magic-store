<!DOCTYPE html>
<html lang="en">
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Part Form</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <style>
        body {
            background-color: #222;
            color: #eee;
            font-family: Verdana, sans-serif;
            padding-top: 50px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #f8d347;
            text-align: center;
        }

        .form-control, input[type="submit"], input[type="button"] {
            background-color: #555;
            color: #eee;
            border: 1px solid #777;
            padding: 0.5rem;
            border-radius: 5px;
        }

        .form-control:focus, input[type="submit"]:focus, input[type="button"]:focus {
            outline: none;
            border-color: #6a5acd;
            box-shadow: 0 0 0 0.2rem rgba(106, 90, 205, 0.5);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Outsourced Part Detail</h1>
    <form action="#" th:action="@{/showFormAddOutPart}" th:object="${outsourcedpart}" method="POST"}>

<!-- Add hidden form field to handle update -->
        <p><input type="hidden" th:field="*{id}"/></p>

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <p><input type="text" id="name" th:field="*{name}" placeholder="Name" class="form-control"/></p>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <p><input type="text" id="price" th:field="*{price}" placeholder="Price" class="form-control"/></p>
            <div th:if="${#fields.hasErrors('price')}" class="text-danger" th:errors="*{price}">Price Error</div>
        </div>

        <div class="mb-3">
            <label for="inv" class="form-label">Inventory</label>
            <p><input type="text" id="inv" th:field="*{inv}" placeholder="Inventory" class="form-control"/></p>
            <div th:if="${#fields.hasErrors('inv')}" class="text-danger" th:errors="*{inv}">Inventory Error</div>
        </div>

        <div class="mb-3">
            <label for="companyName" class="form-label">Company Name</label>
            <p><input type="text" id="companyName" th:field="*{companyName}" placeholder="Company Name" class="form-control"/></p>
        </div>

        <div class="mb-3">
            <p><input type="submit" value="Submit" class="btn btn-primary"/></p>
        </div>
    </form>
    <a href="http://localhost:8080/" class="btn btn-secondary">Go
        to Main Screen</a>
</div>
</body>
</html>
