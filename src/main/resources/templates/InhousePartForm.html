<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inhouse Part Form - Owl's Secret Magic Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a'
                        },
                        accent: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e'
                        }
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'scale-in': 'scaleIn 0.4s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.95)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <!-- Navigation Header -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 backdrop-blur-sm bg-white/95">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gradient-to-br from-primary-500 to-accent-500 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-sm">🦉</span>
                    </div>
                    <h1 class="text-xl font-semibold text-gray-900">Owl's Secret Magic Store</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a th:href="@{/mainscreen}" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="animate-fade-in">
            <!-- Page Header -->
            <div class="mb-8">
                <div class="flex items-center space-x-3 mb-2">
                    <div class="w-10 h-10 bg-primary-100 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-900">Inhouse Part Form</h1>
                </div>
                <p class="text-gray-600">Create or edit inhouse part information</p>
            </div>

            <!-- Part Form -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 animate-slide-up">
                <form action="#" th:action="@{/showFormAddInPart}" th:object="${inhousepart}" method="POST" class="space-y-6">
                    <!-- Hidden field for part ID -->
                    <input type="hidden" th:field="*{id}" />

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Part Name -->
                        <div class="space-y-2">
                            <label for="name" class="block text-sm font-medium text-gray-700">Part Name</label>
                            <input type="text" th:field="*{name}" id="name" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors duration-200 placeholder-gray-400"
                                   placeholder="Enter part name" />
                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-sm text-red-600"></div>
                        </div>

                        <!-- Price -->
                        <div class="space-y-2">
                            <label for="price" class="block text-sm font-medium text-gray-700">Price</label>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">$</span>
                                <input type="number" th:field="*{price}" id="price" step="0.01" required
                                       class="w-full pl-8 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors duration-200 placeholder-gray-400"
                                       placeholder="0.00" />
                            </div>
                            <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-sm text-red-600"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Inventory -->
                        <div class="space-y-2">
                            <label for="inv" class="block text-sm font-medium text-gray-700">Inventory</label>
                            <input type="number" th:field="*{inv}" id="inv" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors duration-200 placeholder-gray-400"
                                   placeholder="Enter inventory count" />
                            <div th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}" class="text-sm text-red-600"></div>
                        </div>

                        <!-- Part ID -->
                        <div class="space-y-2">
                            <label for="partId" class="block text-sm font-medium text-gray-700">Part ID</label>
                            <input type="number" th:field="*{partId}" id="partId" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors duration-200 placeholder-gray-400"
                                   placeholder="Enter part ID" />
                            <div th:if="${#fields.hasErrors('partId')}" th:errors="*{partId}" class="text-sm text-red-600"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Minimum Inventory -->
                        <div class="space-y-2">
                            <label for="minInv" class="block text-sm font-medium text-gray-700">Minimum Inventory</label>
                            <input type="number" th:field="*{minInv}" id="minInv" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors duration-200 placeholder-gray-400"
                                   placeholder="Enter minimum inventory" />
                            <div th:if="${#fields.hasErrors('minInv')}" th:errors="*{minInv}" class="text-sm text-red-600"></div>
                        </div>

                        <!-- Maximum Inventory -->
                        <div class="space-y-2">
                            <label for="maxInv" class="block text-sm font-medium text-gray-700">Maximum Inventory</label>
                            <input type="number" th:field="*{maxInv}" id="maxInv" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors duration-200 placeholder-gray-400"
                                   placeholder="Enter maximum inventory" />
                            <div th:if="${#fields.hasErrors('maxInv')}" th:errors="*{maxInv}" class="text-sm text-red-600"></div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="flex flex-col sm:flex-row gap-4 pt-6 border-t border-gray-200">
                        <button type="submit" class="inline-flex items-center justify-center px-6 py-3 bg-primary-600 text-white font-medium rounded-lg hover:bg-primary-700 focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors duration-200 shadow-sm">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                            Save Part
                        </button>
                        <a th:href="@{/mainscreen}" class="inline-flex items-center justify-center px-6 py-3 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors duration-200">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
