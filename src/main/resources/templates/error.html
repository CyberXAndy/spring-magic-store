<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Magic Store</title>
    <link rel="stylesheet" th:href="@{/css/demo.css}">
</head>
<body>
    <div class="container">
        <h1>Oops! Something went wrong</h1>
        
        <div class="error-content">
            <h2 th:text="'Error ' + ${status}">Error</h2>
            <p th:text="${error}">An unexpected error occurred.</p>
            
            <div class="error-actions">
                <a th:href="@{/mainscreen}" class="btn btn-primary">Return to Main Screen</a>
                <a th:href="@{/about}" class="btn btn-secondary">About</a>
            </div>
        </div>
    </div>
</body>
</html>
