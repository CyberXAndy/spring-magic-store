<!DOCTYPE html>
<html lang="en">
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Part Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <style>
        body {
            background-color: #222;
            color: #eee;
            font-family: Verdana, sans-serif;
            padding-top: 50px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #f8d347;
            text-align: center;
        }

        .form-control, input[type="submit"], input[type="button"] {
            background-color: #555;
            color: #eee;
            border: 1px solid #777;
            padding: 0.5rem;
            border-radius: 5px;
        }

        .form-control:focus, input[type="submit"]:focus, input[type="button"]:focus {
            outline: none;
            border-color: #6a5acd;
            box-shadow: 0 0 0 0.2rem rgba(106, 90, 205, 0.5);
        }

        .table {
            background-color: #444;
            color: #eee;
        }

        .thead-dark th {
            background-color: #6a5acd;
            border-color: #6a5acd;
            color: #eee;
        }

        .thead-dark th:first-child {
            border-top-left-radius: 10px;
        }

        .thead-dark th:last-child {
            border-top-right-radius: 10px;
        }

        .table-bordered th, .table-bordered td {
            border-color: #666;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Product Detail</h1>
    <form action="#" th:action="@{/showFormAddProduct}" th:object="${product}" method="POST"}>

    <!-- Add hidden form field to handle update -->
        <p><input type="hidden" th:field="*{id}"/></p>

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <p><input type="text" id="name" th:field="*{name}" placeholder="Name" class="form-control"/></p>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <p><input type="text" id="price" th:field="*{price}" placeholder="Price" class="form-control"/></p>
        </div>

        <div class="mb-3">
            <label for="inv" class="form-label">Inventory</label>
            <p><input type="text" id="inv" th:field="*{inv}" placeholder="Inventory" class="form-control"/></p>
        </div>

        <div th:if="${#fields.hasAnyErrors()}" class="text-danger">
            <ul>
                <li th:each="err: ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <div class="mb-3">
            <p><input type="submit" value="Submit" class="btn btn-primary"/></p>
        </div>
    </form>

    <h2>Available Parts</h2>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Inventory</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempPart : ${availparts}">
            <td th:text="${tempPart.name}">1</td>
            <td th:text="${tempPart.price}">1</td>
            <td th:text="${tempPart.inv}">1</td>
            <td><a th:href="@{/associatepart(partID=${tempPart.id})}" class="btn btn-primary btn-sm mb-3">Add</a></td>
        </tr>
        </tbody>
    </table>

    <h2>Associated Parts</h2>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Inventory</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempPart : ${assparts}">
            <td th:text="${tempPart.name}">1</td>
            <td th:text="${tempPart.price}">1</td>
            <td th:text="${tempPart.inv}">1</td>
            <td><a th:href="@{/removepart(partID=${tempPart.id})}" class="btn btn-primary btn-sm mb-3">Remove</a></td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/mainscreen}" class="btn btn-secondary">Go to Main Screen</a>
</div>
</body>
</html>
