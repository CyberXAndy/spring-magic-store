# Default configuration - for production optimizations use: --spring.profiles.active=prod
# See application-prod.properties for production-specific settings

# Build the JDBC URL from its component parts
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

# Set the username and password explicitly
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Keep the necessary dialect and SSL settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.data-source-properties.sslmode=require

server.forward-headers-strategy=NATIVE
server.use-forward-headers=true
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto

# Security configurations
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Disable unnecessary endpoints
management.endpoints.enabled-by-default=false
spring.jmx.enabled=false

# Session security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# Logging security
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Security Audit Logging
logging.level.SECURITY_AUDIT=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n