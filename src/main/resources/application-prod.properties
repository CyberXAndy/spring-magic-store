# Production-specific configuration for faster startup

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.data-source-properties.sslmode=require

# JPA/Hibernate Performance Optimizations
# SECURITY: Use 'validate' or 'none' in production to prevent data loss
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# Connection Pool Optimizations
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=HikariCP-Prod

# Server Configuration
server.forward-headers-strategy=NATIVE
server.use-forward-headers=true
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=8192

# Disable unnecessary features for production
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Logging optimizations
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.catalina=WARN

# DEMO MODE: Enable database reset in production for demo purposes
# This will reset the database on startup and every 24 hours
app.database.reset.enabled=true

# Application-specific optimizations for faster startup
spring.main.lazy-initialization=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.cache.use_structured_entries=false
spring.jpa.properties.hibernate.cache.auto_evict_collection_cache=true

# Faster context initialization
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration,org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration

# Tomcat startup optimizations
server.tomcat.additional-tld-skip-patterns=*.jar
server.tomcat.background-processor-delay=30
server.tomcat.mbeanregistry.enabled=false
server.tomcat.processor-cache=200
server.tomcat.uri-encoding=UTF-8

# Disable unnecessary Spring Boot features
spring.jmx.enabled=false
management.endpoints.enabled-by-default=false
spring.output.ansi.enabled=never
spring.banner.mode=off
spring.main.register-shutdown-hook=false
spring.application.admin.enabled=false

# Additional JPA optimizations
spring.jpa.properties.hibernate.bytecode.use_reflection_optimizer=false
spring.jpa.properties.hibernate.max_fetch_depth=3
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.connection.autocommit=false

# Database connection optimizations
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.isolate-internal-queries=true

# Logging optimizations for faster startup
logging.level.org.springframework.boot=ERROR
logging.level.org.springframework.context=ERROR
logging.level.org.springframework.beans=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.transaction=ERROR
logging.level.org.springframework.orm=ERROR
logging.level.org.springframework.data=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type=ERROR
logging.level.org.hibernate.engine=ERROR
logging.level.org.hibernate.internal=ERROR
logging.level.com.zaxxer.hikari.HikariConfig=ERROR
logging.level.com.zaxxer.hikari.pool=ERROR